services:
  postgres:
    image: postgres:16-alpine
    container_name: gestao_matriculas_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestao_matriculas
      POSTGRES_USER: matriculas_user
      POSTGRES_PASSWORD: matriculas_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
