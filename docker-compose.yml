services:
  # 1. Banco de Dados Relacional PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: sigma_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestao_matriculas}
      POSTGRES_USER: ${POSTGRES_USER:-matriculas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-matriculas_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-matriculas_user} -d ${POSTGRES_DB:-gestao_matriculas}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - sigma_network

  # 2. Cache em Memória Redis 7 (Opcional - o backend faz fallback automático para Caffeine se ausente)
  redis:
    image: redis:7-alpine
    container_name: sigma_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - sigma_network

  # 3. Backend REST API (Java 21 / Spring Boot 3)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sigma_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/gestao_matriculas}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/gestao_matriculas}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-matriculas_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-matriculas_pass}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_CACHE_TYPE: ${SPRING_CACHE_TYPE:-redis}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      INITIAL_USER_PASSWORD: ${INITIAL_USER_PASSWORD:-admin123}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 35s
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M
    networks:
      - sigma_network

  # 4. Frontend Web UI Standalone (Next.js 16)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
    container_name: sigma_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - sigma_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  sigma_network:
    driver: bridge
