spring.application.name=backend
server.port=8080
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Banco de dados PostgreSQL (padrão de implantação e Docker)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gestao_matriculas}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:matriculas_user}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:matriculas_pass}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configurações de Segurança e JWT (Token com validade máxima estrita de 2 horas)
jwt.secret=santoandre_cultural_escolas_livres_secret_token_2026_super_secure_sigma_key
jwt.expiration=7200000

# Serviço de E-mails Transacionais (Resend)
resend.api.key=${RESEND_API_KEY:}
resend.from.email=${RESEND_FROM_EMAIL:onboarding@resend.dev}

# Cache Distribuído e Resiliência (Redis / Caffeine)
spring.cache.type=${SPRING_CACHE_TYPE:redis}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms

