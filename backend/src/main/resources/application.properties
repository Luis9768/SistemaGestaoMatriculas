spring.application.name=backend
server.port=8080
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Banco de dados PostgreSQL (padrão de implantação e Docker)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gestao_matriculas}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:matriculas_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:matriculas_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configurações de Segurança e JWT
jwt.secret=santoandre_cultural_escolas_livres_secret_token_2026_super_secure_sigma_key
jwt.expiration=86400000
