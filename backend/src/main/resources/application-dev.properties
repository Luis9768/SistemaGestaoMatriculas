# Configuração do Banco de Dados PostgreSQL para Desenvolvimento Local
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gestao_matriculas}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:matriculas_user}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:matriculas_pass}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate com Dialeto PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# H2 desativado (banco padrão agora é PostgreSQL)
spring.h2.console.enabled=false

# Cache Distribuído (Redis)
spring.cache.type=${SPRING_CACHE_TYPE:redis}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms
