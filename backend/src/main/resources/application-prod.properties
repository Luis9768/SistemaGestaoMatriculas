# ==============================================================================
# Configurações de Produção / Nuvem (Easypanel / Docker / Cloud PostgreSQL)
# ==============================================================================

# Banco de Dados PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Desativa console H2 em produção (Segurança)
spring.h2.console.enabled=false

# Evita escaneamento desnecessário de repositórios Redis sobre entidades JPA
spring.data.redis.repositories.enabled=false

# Em nuvem (Easypanel), usa Caffeine em memória por padrão caso Redis não seja configurado
spring.cache.type=${SPRING_CACHE_TYPE:caffeine}

# CORS flexível na nuvem (aceita domínio específico ou '*' para testes)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
